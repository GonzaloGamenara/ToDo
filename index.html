<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lista ToDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem('todo-spa-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
  </button>

  <main class="app">
    <header class="app-header">
      <h1>✨ Mi Lista</h1>
      <p class="subtitle">Organizá tu día, una tarea a la vez</p>
    </header>

    <section class="card">
      <form id="todo-form" class="add-form" autocomplete="off">
        <input
          id="todo-input"
          type="text"
          placeholder="¿Qué necesitás hacer?"
          maxlength="120"
          required
        />
        <select id="todo-category" class="category-select" aria-label="Categoría">
          <option value="personal">Personal</option>
          <option value="trabajo">Trabajo</option>
          <option value="compras">Compras</option>
          <option value="salud">Salud</option>
          <option value="otro">Otro</option>
        </select>
        <button type="submit" class="add-btn" aria-label="Agregar tarea">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </form>

      <div class="tracker" id="tracker">
        <div class="tracker-group">
          <span class="tracker-emoji" title="Agua">💧</span>
          <button class="tracker-item water" data-type="water" data-index="0" aria-label="Botella de agua 1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2h5M10 2v3.3c0 .5-.2 1-.6 1.4L8 8.1A3 3 0 0 0 7 10.3V19a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-8.7a3 3 0 0 0-1-2.2l-1.4-1.4a2 2 0 0 1-.6-1.4V2"/></svg>
          </button>
          <button class="tracker-item water" data-type="water" data-index="1" aria-label="Botella de agua 2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2h5M10 2v3.3c0 .5-.2 1-.6 1.4L8 8.1A3 3 0 0 0 7 10.3V19a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-8.7a3 3 0 0 0-1-2.2l-1.4-1.4a2 2 0 0 1-.6-1.4V2"/></svg>
          </button>
          <button class="tracker-item water" data-type="water" data-index="2" aria-label="Botella de agua 3">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2h5M10 2v3.3c0 .5-.2 1-.6 1.4L8 8.1A3 3 0 0 0 7 10.3V19a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-8.7a3 3 0 0 0-1-2.2l-1.4-1.4a2 2 0 0 1-.6-1.4V2"/></svg>
          </button>
          <button class="tracker-item water" data-type="water" data-index="3" aria-label="Botella de agua 4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2h5M10 2v3.3c0 .5-.2 1-.6 1.4L8 8.1A3 3 0 0 0 7 10.3V19a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-8.7a3 3 0 0 0-1-2.2l-1.4-1.4a2 2 0 0 1-.6-1.4V2"/></svg>
          </button>
        </div>
        <div class="tracker-divider"></div>
        <div class="tracker-group">
          <span class="tracker-emoji" title="Café">☕</span>
          <button class="tracker-item coffee" data-type="coffee" data-index="0" aria-label="Café 1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M16 10h1.5a2.5 2.5 0 1 1 0 5H16"/><path d="M7.5 4c0 1 1 1 1 2M11.5 4c0 1 1 1 1 2"/></svg>
          </button>
          <button class="tracker-item coffee" data-type="coffee" data-index="1" aria-label="Café 2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M16 10h1.5a2.5 2.5 0 1 1 0 5H16"/><path d="M7.5 4c0 1 1 1 1 2M11.5 4c0 1 1 1 1 2"/></svg>
          </button>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-label" class="progress-label">0 de 0 completadas</span>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="active">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🌤️</div>
        <p>No hay tareas por acá.<br>¡Agregá la primera!</p>
      </div>

      <footer class="list-footer">
        <span id="items-left">0 tareas</span>
        <button id="clear-completed" class="ghost-btn">Borrar completadas</button>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
